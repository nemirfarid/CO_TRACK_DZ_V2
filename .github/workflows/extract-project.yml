
name: Extract Flutter project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p /tmp/co_track
          unzip -o CO_TRACK_DZ_V2_REBUILT.zip -d /tmp/co_track
          ROOT=$(find /tmp/co_track -name pubspec.yaml -printf '%h\n' | head -n 1)
          test -n "$ROOT"
          cp -a "$ROOT"/. .

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Flutter project files" || echo "No changes"
          git push
